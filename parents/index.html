<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>For parents · LifeHub Risers</title>
<link rel="icon" href="/assets/lifehub-mark.png" />
<link rel="stylesheet" href="/end-of-term-2/shared/eot2.css" />
<link rel="stylesheet" href="/term-3/grade10/grade10.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/lifehub.css" />
<link rel="stylesheet" href="/signin/signin.css" />
<style>
.pf-wrap { max-width: 760px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 40px; box-sizing: border-box; }
.pf-logo { display: block; width: 170px; max-width: 55vw; margin: 6px auto 22px; }
.pf-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 26px 24px; }
.pf-card h1 { font-family: var(--font-head); font-size: 1.5rem; margin: 0 0 6px; }
.pf-card > p { color: var(--ink-soft); margin: 0 0 18px; line-height: 1.5; }
.pf-form { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); background: var(--paper); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 16px 18px; margin-top: 10px; }
.pf-form:hover { border-color: var(--brand-green); background: var(--accent-soft); }
.pf-form strong { display: block; font-size: 1.05rem; }
.pf-form span { color: var(--ink-soft); font-size: .92rem; }
.pf-form .pf-go { margin-left: auto; color: var(--accent); font-size: 1.3rem; }
.pf-pill { display: inline-block; margin-top: 6px; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); }
.pf-pill.is-ok { background: var(--good-soft); color: var(--good); }
.si-name { text-decoration: none; }
.pf-msg { text-align: center; color: var(--ink-soft); margin: 40px 0; }
#app { max-width: 760px; margin: 0 auto; }
#app .eot2-status { display: none; } /* "Saved": nothing is kept until Submit here */
</style>
</head>
<body>
<div class="pf-wrap">
  <img class="pf-logo" src="/assets/lifehub-logo.png" alt="LifeHub — A Homeschooling Cooperative" />
  <div id="pf"><p class="pf-msg">Loading…</p></div>
  <div id="app"></div>
</div>
<script src="parents.js"></script>
</body>
</html>
