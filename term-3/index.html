<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Term 3 — Risers Journey</title>
<link rel="stylesheet" href="../home.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lifehub.css" />
<script src="../assets/brand.js"></script>
</head>
<body>
<div id="app"></div>
<script src="assessments/assessments-data.js"></script>
<script>
/* A Riser's Term 3: their group's quest (or one they make up themselves),
   the weekly check-in, their schedule and their assessments. */
(function () {
  var kid = null, staff = null;
  try { kid = (localStorage.getItem('imm-l3-kid') || '').toLowerCase(); staff = localStorage.getItem('rj-staff-name'); } catch (e) {}
  if (!kid) { location.replace(staff ? '../staff/term-3/index.html' : '../index.html'); return; }
  var tiles = [
    { title: 'Weekly Check-in', desc: 'Each week, tick off what your family agreed at the Term 2 Conference.', href: 'check-in/index.html', icon: 'check', tone: 'amber' }
  ];
  tiles.push({ title: 'My Schedule', desc: 'Your week at LifeHub, day by day.', href: 'schedule/index.html', icon: 'clock', tone: 'violet' });
  tiles.push({ title: 'Assessments', desc: 'Your Term 3 assessments, marked papers and revision plan.', href: 'assessments/index.html', icon: 'paper', tone: 'slate' });
  tiles.unshift({ title: 'Term 3 Quest', desc: 'Your group’s project: choose it, plan it, build it, and check in every week.', href: 'quest/index.html', icon: 'skills', tone: 'green' },
    { title: 'Our Own Quest', desc: 'Got your own idea? Make up a quest and send it to a facilitator to OK.', href: 'quest/index.html?own=1', icon: 'quests', tone: 'rose' });
  document.getElementById('app').innerHTML =
    '<header class="hd-welcome"><h1>Term 3</h1><p>26 October – 21 January</p></header>' +
    '<div class="hd-tiles">' + window.LH_tiles(tiles) + '</div>';
})();
</script>
</body>
</html>
