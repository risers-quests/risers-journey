<style>
  .to-box { max-width: 640px; background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; }
  .to-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; font-weight: 700; font-size: .8rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
  .to-field select { font: inherit; font-size: 1rem; text-transform: none; letter-spacing: 0; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 10px; max-width: 260px; }
  .to-check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--border); line-height: 1.45; }
  .to-check input { margin-top: 4px; }
  .to-note { color: var(--ink-soft); font-size: .88rem; }
  .to-btn { font: inherit; font-weight: 700; border: 0; border-radius: 99px; padding: 11px 22px; background: #b0303a; color: #fff; cursor: pointer; }
  .to-btn:disabled { opacity: .6; }
  .to-msg { font-weight: 600; margin: 10px 0 0; }
  .to-msg.is-ok { color: var(--good); }
  .to-msg.is-bad { color: #a3432b; }
</style>
<script src="../../assets/brand.js" data-area="staff"></script>
</head>

</body>
