<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Risers’ links — Risers Journey — Staff</title>
<link rel="stylesheet" href="../../home.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/lifehub.css" />
<script src="../../assets/brand.js" data-area="staff"></script>
<script src="../../end-of-term-2/shared/eot2-data.js"></script>
<script src="../riser-links.js"></script>
<style>
.rl-list { background: #fff; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; max-width: 820px; }
.rl-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); }
.rl-row:first-child { border-top: 0; }
.rl-row strong { font-size: .98rem; }
.rl-row a { font-size: .88rem; color: var(--accent); word-break: break-all; }
.rl-copy { font: inherit; font-size: .85rem; font-weight: 600; padding: 7px 16px; border-radius: 99px; border: 1.5px solid var(--border); background: #fff; color: var(--ink-soft); cursor: pointer; min-width: 84px; }
.rl-copy:hover { border-color: var(--accent); color: var(--accent); }
.rl-copy.is-done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.rl-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; max-width: 820px; }
.rl-bar p { flex: 1; margin: 0; font-size: .9rem; color: var(--ink-soft); min-width: 240px; }
@media (max-width: 560px) { .rl-row { grid-template-columns: 1fr auto; } .rl-row a { grid-column: 1 / -1; grid-row: 2; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Staff: every Riser's own link, ready to copy and send to the family. */
(function () {
  var staff = null;
  try { staff = localStorage.getItem('rj-staff-name'); } catch (e) {}
  if (!staff) { location.replace('../index.html'); return; }
  var LINKS = window.LH_RISER_LINKS, home = new URL('../../', location.href).href;
  var app = document.getElementById('app');
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  function copy(text, btn, label) {
    var done = function () { btn.textContent = 'Copied ✓'; btn.classList.add('is-done'); setTimeout(function () { btn.textContent = label; btn.classList.remove('is-done'); }, 1600); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, function () { prompt('Copy this:', text); });
    else prompt('Copy this:', text);
  }
  var kids = window.EOT2_KIDS.filter(function (k) { return LINKS[k.slug]; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  app.appendChild(el('header', 'hd-welcome', '<h1>Risers’ links</h1><p>Each link opens that Riser’s Home, already signed in. Send each one only to that Riser’s family.</p>'));
  var bar = el('div', 'rl-bar', '<p>' + kids.length + ' Risers</p>');
  var all = el('button', 'rl-copy', 'Copy all');
  all.type = 'button';
  all.addEventListener('click', function () {
    copy(kids.map(function (k) { return k.name + ': ' + home + LINKS[k.slug]; }).join('\n'), all, 'Copy all');
  });
  bar.appendChild(all);
  app.appendChild(bar);
  var list = el('div', 'rl-list');
  kids.forEach(function (k) {
    var url = home + LINKS[k.slug];
    var row = el('div', 'rl-row', '<strong>' + k.name + '</strong><a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>');
    var b = el('button', 'rl-copy', 'Copy');
    b.type = 'button';
    b.addEventListener('click', function () { copy(url, b, 'Copy'); });
    row.appendChild(b);
    list.appendChild(row);
  });
  app.appendChild(list);
})();
</script>
</body>
</html>
