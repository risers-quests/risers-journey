<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Risers’ grades — Risers Journey — Staff</title>
<link rel="stylesheet" href="../../home.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/lifehub.css" />
<script src="../../assets/brand.js" data-area="staff"></script>
<script src="../../end-of-term-2/shared/eot2-data.js"></script>
<script src="../riser-grades.js"></script>
<style>
.rg-wrap { max-width: 820px; overflow-x: auto; }
.rg-table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
.rg-table th, .rg-table td { padding: 12px 16px; text-align: left; border-top: 1px solid var(--border); font-size: .95rem; }
.rg-table thead th { border-top: 0; font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); background: #fafbf8; }
.rg-table tbody th { font-weight: 600; }
.rg-g { display: inline-block; min-width: 76px; padding: 4px 10px; border-radius: 99px; font-size: .85rem; font-weight: 600; background: var(--accent-soft); color: var(--accent-dark); text-align: center; }
.rg-none { color: var(--ink-soft); }
.rg-note { max-width: 820px; font-size: .88rem; color: var(--ink-soft); margin: 14px 0 0; }
@media (max-width: 560px) { .rg-table th, .rg-table td { padding: 10px 8px; font-size: .88rem; } .rg-g { min-width: 0; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Staff: the grade each Riser works at in Maths, Language Arts and Writing (from ../riser-grades.js). */
(function () {
  var staff = null;
  try { staff = localStorage.getItem('rj-staff-name'); } catch (e) {}
  if (!staff) { location.replace('../index.html'); return; }
  var G = window.LH_RISER_GRADES || {};
  var app = document.getElementById('app');
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
  var cell = function (g) { return g ? '<span class="rg-g">Grade ' + g + '</span>' : '<span class="rg-none">—</span>'; };
  // Grouped by Maths grade (highest first), then by name.
  var kids = window.EOT2_KIDS.filter(function (k) { return G[k.slug]; }).sort(function (a, b) {
    return (G[b.slug].maths - G[a.slug].maths) || a.name.localeCompare(b.name);
  });
  app.appendChild(el('header', 'hd-welcome', '<h1>Risers’ grades</h1><p>The level each Riser works at, subject by subject.</p>'));
  var rows = kids.map(function (k) {
    var g = G[k.slug];
    return '<tr><th scope="row">' + k.name + '</th><td>' + cell(g.maths) + '</td><td>' + cell(g.language) + (k.slug === 'benjamin' ? ' <small class="rg-none">(English)</small>' : '') + '</td><td>' + cell(g.writing) + '</td></tr>';
  }).join('');
  app.appendChild(el('div', 'rg-wrap', '<table class="rg-table"><thead><tr><th>Riser</th><th>Maths</th><th>Language Arts</th><th>Writing</th></tr></thead><tbody>' + rows + '</tbody></table>'));
  app.appendChild(el('p', 'rg-note', kids.length + ' Risers. To change a grade, edit staff/riser-grades.js.'));
})();
</script>
</body>
</html>
